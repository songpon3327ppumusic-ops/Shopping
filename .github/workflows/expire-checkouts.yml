name: Expire unpaid checkout reservations

on:
  schedule:
    # GitHub Actions scheduled workflows have a minimum 5-minute interval.
    - cron: "*/5 * * * *"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: expire-checkouts
  cancel-in-progress: false

jobs:
  expire:
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - name: Release expired checkout reservations
        env:
          APP_BASE_URL: ${{ secrets.APP_BASE_URL }}
          CRON_SECRET: ${{ secrets.CRON_SECRET }}
        shell: bash
        run: |
          set -euo pipefail
          if [[ -z "${APP_BASE_URL}" || -z "${CRON_SECRET}" ]]; then
            echo "::error::Configure APP_BASE_URL and CRON_SECRET in repository Actions secrets."
            exit 1
          fi
          case "${APP_BASE_URL}" in
            https://*) ;;
            *) echo "::error::APP_BASE_URL must use HTTPS."; exit 1 ;;
          esac
          APP_BASE_URL="${APP_BASE_URL%/}"
          status="$(curl --silent --show-error --output response.json --write-out '%{http_code}' \
            --max-time 45 --request POST \
            --header "Authorization: Bearer ${CRON_SECRET}" \
            --header "Accept: application/json" \
            "${APP_BASE_URL}/api/internal/expire-checkouts")"
          if [[ "${status}" -lt 200 || "${status}" -ge 300 ]]; then
            echo "::error::Reservation cleanup endpoint returned HTTP ${status}."
            cat response.json
            exit 1
          fi
          cat response.json
