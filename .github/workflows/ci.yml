name: CI

on:
  pull_request:
  push:
    branches: [main, "codex/lumiere-studio-storefront"]

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Validate database schema
        run: npx --yes prisma@6 validate
        env:
          DATABASE_URL: postgresql://ci:ci@localhost:5432/lumiere_ci
      - name: Install dependencies
        shell: bash
        run: |
          npm install --no-audit --no-fund || {
            echo "npm install failed; clearing npm cache and retrying once."
            npm cache clean --force
            npm install --no-audit --no-fund
          }
      - name: Check production dependency advisories
        run: npm audit --audit-level=high
      - run: npm run test
      - run: npm run typecheck
      - run: npm run lint
      - run: npm run build
        env:
          CI: true
