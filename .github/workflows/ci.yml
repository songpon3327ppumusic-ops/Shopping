name: CI

on:
  pull_request:
  push:
    branches: [main, "codex/lumiere-studio-storefront"]

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      # Pin npm instead of inheriting the runner image's npm release. This
      # makes dependency resolution reproducible while the project lockfile is
      # being established and avoids runner-only Arborist regressions.
      - name: Pin npm
        run: npm install --global npm@10.9.2
      - name: Validate database schema
        run: npx --yes prisma@6 validate
        env:
          DATABASE_URL: postgresql://ci:ci@localhost:5432/lumiere_ci
      - name: Install dependencies
        run: npm install --no-audit --no-fund
      - name: Check production dependency advisories
        run: npm audit --audit-level=high
      - run: npm run test
      - run: npm run typecheck
      - run: npm run lint
      - run: npm run build
        env:
          CI: true
